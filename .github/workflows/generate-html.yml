name: 生成游戏 ROM 网站页面

on:
  push:
    branches:
      - res
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  checks: write
  pull-requests: write

jobs:
  generate-html:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          ref: res

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
            python-version: 3.11

      - name: Install Python dependencies
        run: |
            python -m pip install --upgrade pip
            pip install -r py/requirements.txt

      - name: 执行 HTML 生成脚本
        run: |
            python ./py/generate_game_site.py

      - name: Commit and push (if changed)
        run: |-
            git config --global user.email "github-bot@example.com"
            git config --global user.name "Github-Bot"
            git add -A
            git commit -m "Updated by Github Bot" || exit 0
            git push origin res

      - name: 显示执行结果
        if: always()
        run: |
          echo "✨ Game ROM 网站生成完成！"
          echo ""
          echo "📊 生成统计:"
          echo "- 系列页面: $(ls -1 sections/*.html 2>/dev/null | wc -l) 个"
          echo "- 首页: $([ -f index.html ] && echo '存在' || echo '不存在')"
