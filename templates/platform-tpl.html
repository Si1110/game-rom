<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ platform_title_full }}</title>
    <meta name="description" content="{{ platform_desc }}">
    <meta name="keywords" content="{{ platform_keywords }}">
    <meta name="robots" content="index, follow">
    <meta name="author" content="Game ROM Collection">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="format-detection" content="telephone=no, email=no">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <link rel="canonical" href="https://si1110.github.io/game-rom/platforms/{{ platform_slug }}.html">
    <meta property="og:title" content="{{ platform_title_full }}">
    <meta property="og:description" content="{{ platform_desc }}">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://si1110.github.io/game-rom/docs/logo.png">
    <meta property="og:url" content="https://si1110.github.io/game-rom/platforms/{{ platform_slug }}.html">
    <meta property="og:site_name" content="经典怀旧游戏 ROM 合集">
    <meta property="og:locale" content="zh_CN">
    <meta property="og:image:width" content="400">
    <meta property="og:image:height" content="120">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ platform_title_full }}">
    <meta name="twitter:description" content="{{ platform_desc }}">
    <meta name="twitter:image" content="https://si1110.github.io/game-rom/docs/logo.png">
    <link rel="icon" href="../docs/logo.png" type="image/png">
    <link href="../docs/css/bootstrap.min.css" rel="stylesheet">
    <link href="../docs/css/style.css" rel="stylesheet">
    <script src="../docs/js/bootstrap.bundle.min.js"></script>
    <script src="../docs/js/cdn-config.js"></script>
    <script src="../docs/js/seo-meta.js"></script>
    
    <!-- 结构化数据（JSON-LD） -->
    <script type="application/ld+json">
{{ jsonld_breadcrumb | safe }}
    </script>
    <script type="application/ld+json">
{{ jsonld_itemlist | safe }}
    </script>
</head>
<body>
    <div class="modal fade" id="downloadModal" tabindex="-1" aria-labelledby="downloadModalLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
      <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
              <div class="modal-header">
                   <h5 class="modal-title" id="downloadModalLabel">请在 60 秒内 <font color="red">支付 3 元</font> 后下载：
                   <p style='color: #666; font-size: 14px; margin-top: 5px;'>付款完成后，等待倒计时结束，点击右下角 &quot;我已支付&quot;，即可进行下载</p></h5>
                   <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body">
                  <div class="d-flex justify-content-around">
                      <img src="../imgs/pay/alipay.png" class="img-fluid" alt="alipay" width="45%">
                      <img src="../imgs/pay/wechat.png" class="img-fluid" alt="wechat" width="45%">
                  </div>
                  <div id="downloadInfo" style="display: none; margin-top: 20px;">
                      <hr>
                      <div class="alert alert-info">
                          <p><strong>下载链接：</strong><a id="modalDownloadLink" href="#" target="_blank">[点我下载]</a></p>
                          <p class="d-flex justify-content-between align-items-center">
                              <span><strong>提取码：</strong><span id="modalExtractCode"></span></span>
                              <button type="button" class="btn btn-sm btn-outline-secondary" onclick="copyToClipboard('modalExtractCode', event)"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-clipboard" viewBox="0 0 16 16"><path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1v-1z"/><path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h3zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3z"/></svg> 复制</button>
                          </p>
                          <p class="d-flex justify-content-between align-items-center">
                              <span><strong>解压密码：</strong><span id="modalUUID"></span></span>
                              <button type="button" class="btn btn-sm btn-outline-secondary" onclick="copyToClipboard('modalUUID', event)"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-clipboard" viewBox="0 0 16 16"><path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1v-1z"/><path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h3zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3z"/></svg> 复制</button>
                          </p>
                      </div>
                  </div>
              </div>
              <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" onclick="closeModal()">取消下载</button>
                  <button type="button" class="btn btn-primary" id="confirmButton" disabled>等待支付 (60)</button>
              </div>
          </div>
      </div>
    </div>

    <div class="hero-banner">
      <div class="hero-bg" style="background-image: url('../docs/hero-bg.png');"></div>
      <div class="hero-overlay"></div>
      <div class="hero-content">
          <h1 class="hero-title">{{ platform_label }} 游戏</h1>
          <p class="hero-desc">本站大部分游戏ROM均是中文汉化版，下载后可直接在模拟器上运行</p>
          <div class="hero-search">
              <div class="input-group">
                  <input type="text" class="form-control" placeholder="搜索游戏名称..." aria-label="搜索" id="heroSearchInput">
                  <button class="btn btn-primary" type="button" id="heroSearchBtn">
                      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                          <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
                      </svg>
                      搜索游戏
                  </button>
              </div>
          </div>
          <p style="color: rgba(255,255,255,0.5); font-size: 13px; margin-top: 12px; text-shadow: 0 1px 6px rgba(0,0,0,0.5);">如果链接失效了，联系QQ3962799299</p>
      </div>
    </div>

    <div class="main-after-hero">
      <!-- 隐藏的全局搜索控件（供 global-search.js 使用） -->
      <div style="display: none;">
          <input type="text" id="globalSearchInput">
          <button id="globalSearchBtn"></button>
      </div>
    <hr/>
    <h4 style="color:#ffff00; background-color:#000000; text-align: center;">{{ platform_label }} 游戏（{{ platform_count }} 款）</h4>
    <hr/>

    <div class="container">
      <div class="row">
{{ cards }}
      </div>
    </div>

    <br/>
    <hr/>
    <br/>

    <button id="backToTop" class="back-to-top" onclick="scrollToTop()" title="回到顶部">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M8 15a.5.5 0 0 0 .5-.5V2.707l3.146 3.147a.5.5 0 0 0 .708-.708l-4-4a.5.5 0 0 0-.708 0l-4 4a.5.5 0 1 0 .708.708L7.5 2.707V14.5a.5.5 0 0 0 .5.5z"/>
        </svg>
    </button>

    {{ emu_sidebar | safe }}

    <a href="../index.html" class="back-to-home" title="返回首页">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
            <path d="M8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 0 0 1.5 7.5v7a.5.5 0 0 0 .5.5h4.5a.5.5 0 0 0 .5-.5v-4h2v4a.5.5 0 0 0 .5.5H14a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.146-.354L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293L8.354 1.146zM2.5 14V7.707l5.5-5.5 5.5 5.5V14H10v-4a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5v4H2.5z"/>
        </svg>
    </a>

    <div class="modal fade" id="searchModal" tabindex="-1" aria-labelledby="searchModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
          <div class="modal-content">
              <div class="modal-header">
                  <h5 class="modal-title" id="searchModalLabel">搜索结果</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body" id="searchResults">
                  <div class="text-center text-muted"><p>正在搜索...</p></div>
              </div>
          </div>
      </div>
    </div>
    </div>

    <script src="../docs/js/main.js"></script>
    <script src="../docs/js/lazy-load.js"></script>
    <script src="../docs/js/global-search.js"></script>
    <script>
        var heroInput = document.getElementById('heroSearchInput');
        var heroBtn = document.getElementById('heroSearchBtn');
        var topInput = document.getElementById('globalSearchInput');
        var topBtn = document.getElementById('globalSearchBtn');
        if (heroInput && topInput) {
            heroInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') { topInput.value = heroInput.value; topBtn.click(); }
            });
            heroBtn.addEventListener('click', function() { topInput.value = heroInput.value; topBtn.click(); });
        }
    </script>
    <script src="../docs/js/add-card-anchors.js"></script>
    <script src="../docs/js/protection.min.js" defer></script>
    <script>
    function toggleDesc(btn) {
        var container = btn.previousElementSibling;
        container.classList.toggle('expanded');
        btn.textContent = container.classList.contains('expanded') ? '收起 ▴' : '展开 ▾';
    }
    </script>
</body>
</html>
